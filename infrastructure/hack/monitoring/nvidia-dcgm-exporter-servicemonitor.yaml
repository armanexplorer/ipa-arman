apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-dcgm-exporter
  namespace: gpu-operator-resources
  labels:
    app: nvidia-dcgm-exporter
spec:
  namespaceSelector:
    matchNames:
      - gpu-operator-resources
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  endpoints:
    - port: gpu-metrics
      interval: 1s
      scrapeTimeout: 1s
